<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#64832e" />
    <meta name="description" content="王柯颖 · 苹果树能力花园互动预览" />
    <title>王柯颖 · 苹果树能力花园（预览 03）</title>
    <link rel="preload" as="image" href="../../assets/scene-reference/scene-03-apple-orchard-reference.png" />
    <link rel="stylesheet" href="scene.css" />
    <script src="scene.js" defer></script>
    <script src="../scene-bridge.js" defer></script>
  </head>
  <body>
    <svg class="sprite-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="apple-skin" cx="31%" cy="27%" r="75%">
          <stop offset="0" stop-color="#ffba72" />
          <stop offset=".25" stop-color="#df5142" />
          <stop offset=".72" stop-color="#ae202a" />
          <stop offset="1" stop-color="#701c20" />
        </radialGradient>
        <linearGradient id="apple-leaf" x1="0" x2="1" y1="1" y2="0">
          <stop stop-color="#244d23" /><stop offset=".58" stop-color="#619543" /><stop offset="1" stop-color="#b5ce68" />
        </linearGradient>
        <symbol id="fruit" viewBox="0 0 112 124">
          <path d="M54 27c-5-7-11-11-20-9C23 20 12 28 9 45-2 92 27 119 46 112c7-3 10-2 17 0 23 8 49-28 42-67-3-19-16-27-29-27-9 0-16 3-22 9Z" fill="url(#apple-skin)" />
          <path d="M53 25c-2-13 1-20 8-24" fill="none" stroke="#624020" stroke-width="5" stroke-linecap="round" />
          <path d="M55 15C63 2 81 2 91 7 84 20 68 28 55 15Z" fill="url(#apple-leaf)" />
          <path d="M57 15c10-7 18-9 29-8" stroke="#c6e28a" stroke-width="1.6" fill="none" opacity=".6" />
          <path d="M22 48c3-11 7-17 16-20" fill="none" stroke="#ffe4b3" stroke-linecap="round" stroke-width="5" opacity=".5" />
          <path d="M29 86c7 18 18 21 24 19" fill="none" stroke="#ffbc91" stroke-linecap="round" stroke-width="2.5" opacity=".24" />
        </symbol>
      </defs>
    </svg>

    <header class="top-bar">
      <a class="back" href="../scene-02-scan/index.html" data-copy="back">← 返回第二幕</a>
      <div class="top-actions">
        <button id="language" class="language" type="button" aria-label="Switch to English" aria-pressed="false"><span>中</span><span class="divider"> / </span><span>EN</span></button>
        <a class="resume-link" href="../../assets/resume/wang-keying-resume-current.pdf" download="王柯颖简历.pdf" data-copy="resume">下载简历 <span aria-hidden="true">↘</span></a>
      </div>
    </header>

    <main class="orchard" data-screen-label="03 · Capability Orchard">
      <div class="scene-world" id="scene-world" aria-hidden="true">
        <div class="far-hills"></div>
        <div class="canopy canopy-mid"></div>
        <div class="character-depth"></div>
        <div class="canopy canopy-near"></div>
        <div class="sun-flecks"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="scene-heading">
        <span class="scene-number">03 / 08 <span class="short-rule"></span> CAPABILITY ORCHARD</span>
        <h1 data-copy="title">一棵树，<br />四种生长的力量。</h1>
        <p data-copy="subtitle">从看见，到让事情发生。</p>
      </div>

      <div class="apple-field" aria-label="四种能力苹果">
        <button class="apple-hotspot" type="button" data-id="observe" style="--ax:18.5%;--ay:22%;--delay:-.7s" aria-expanded="false">
          <span class="apple-orbit" aria-hidden="true"></span><span class="apple-sprite" aria-hidden="true"><svg viewBox="0 0 112 124"><use href="#fruit"></use></svg></span>
          <span class="leaf-label" data-label="observe">洞察 <em>Observe</em></span>
        </button>
        <button class="apple-hotspot" type="button" data-id="shape" style="--ax:37.5%;--ay:28%;--delay:-1.7s" aria-expanded="false">
          <span class="apple-orbit" aria-hidden="true"></span><span class="apple-sprite" aria-hidden="true"><svg viewBox="0 0 112 124"><use href="#fruit"></use></svg></span>
          <span class="leaf-label" data-label="shape">策划 <em>Shape</em></span>
        </button>
        <button class="apple-hotspot" type="button" data-id="activate" style="--ax:58%;--ay:15%;--delay:-2.4s" aria-expanded="false">
          <span class="apple-orbit" aria-hidden="true"></span><span class="apple-sprite" aria-hidden="true"><svg viewBox="0 0 112 124"><use href="#fruit"></use></svg></span>
          <span class="leaf-label" data-label="activate">推动 <em>Activate</em></span>
        </button>
        <button class="apple-hotspot" type="button" data-id="evolve" style="--ax:77%;--ay:30%;--delay:-.3s" aria-expanded="false">
          <span class="apple-orbit" aria-hidden="true"></span><span class="apple-sprite" aria-hidden="true"><svg viewBox="0 0 112 124"><use href="#fruit"></use></svg></span>
          <span class="leaf-label" data-label="evolve">迭代 <em>Evolve</em></span>
        </button>
      </div>

      <div class="ground-story" id="ground-story">
        <p class="interaction-hint" id="interaction-hint"><span class="hint-sparkle" aria-hidden="true">✳</span><span data-copy="hint">点击苹果看看会发生什么吧</span></p>
        <div class="fallen-fruit" id="fallen-fruit" aria-hidden="true">
          <div class="half half-left"><svg viewBox="0 0 112 124"><use href="#fruit"></use></svg></div>
          <div class="half half-right"><svg viewBox="0 0 112 124"><use href="#fruit"></use></svg></div>
          <div class="seed-cloud"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <section class="capability-result" id="capability-result" aria-live="polite" aria-label="能力故事" inert>
          <div class="result-eyebrow"><span class="seed-symbol" aria-hidden="true"></span><span data-copy="resultKicker">一颗种子，长出一段经历</span></div>
          <h2 id="result-title"></h2>
          <p id="result-description"></p>
          <button class="close-result" id="close-result" type="button" data-copy="close">收起 <span aria-hidden="true">↗</span></button>
        </section>
      </div>

      <div class="chapter-mark" aria-hidden="true"><span>03</span><span class="chapter-line"></span><span>08</span></div>
    </main>
  </body>
</html>
